<script>
const LISTE = [{"n": 1, "ime": "Gibanje Svoboda"}, {"n": 2, "ime": "Slovenska ljudska stranka"}, {"n": 3, "ime": "Demokrati. Anžeta Logarja"}, {"n": 4, "ime": "Pirati"}, {"n": 5, "ime": "Levica"}, {"n": 6, "ime": "Prerod – stranka Vladimirja Prebiliča"}, {"n": 7, "ime": "Slovenska demokratska stranka – SDS"}, {"n": 8, "ime": "Vesna – zelena stranka"}, {"n": 9, "ime": "Nova Slovenija in Fokus"}, {"n": 10, "ime": "Socialni demokrati"}, {"n": 11, "ime": "Cilj – Bežigrad"}, {"n": 12, "ime": "Stranka Straža – katoliška narodna stranka"}, {"n": 13, "ime": "Ljubljana smo vsi – lista mag. Urške Klakočar Zupančič in dr. Antona Ropa"}, {"n": 14, "ime": "Državljansko gibanje Resni.ca"}, {"n": 15, "ime": "Lista Zorana Jankovića"}];
const n = parseInt(new URLSearchParams(location.search).get("n") || "", 10);
const IZP = {1: "lista-1.html", 2: "lista-2.html", 4: "lista-4.html", 5: "lista-5.html", 6: "lista-6.html", 7: "lista-7.html", 8: "lista-8.html", 9: "lista-9.html", 10: "lista-10.html", 11: "lista-11.html", 12: "lista-12.html", 13: "lista-13.html", 15: "lista-15.html"};
if (IZP[n]) { location.replace(IZP[n]); }
const i = LISTE.findIndex(x => x.n === n);
if (i < 0) {
  document.getElementById("naslov").textContent = "Lista ni na seznamu VE 01";
} else {
  const L = LISTE[i];
  document.title = L.n + ". " + L.ime;
  document.getElementById("naslov").innerHTML = '<span class="nr">' + L.n + ".</span> " + L.ime;
  document.getElementById("podnaslov").textContent = L.ime;
  document.getElementById("status").className = "povzetek";
  document.getElementById("status").textContent = "Brez odgovora";
  function navHtml() {
    const prev = LISTE[i - 1];
    const next = LISTE[i + 1];
    const left = prev
      ? '<a href="' + (IZP[prev.n] || "lista.html?n=" + prev.n) + '">← ' + prev.n + ". " + prev.ime + "</a>"
      : "<span></span>";
    const right = next
      ? '<a class="next" href="' + (IZP[next.n] || "lista.html?n=" + next.n) + '">' + next.n + ". " + next.ime + " →</a>"
      : "<span></span>";
    return left + right;
  }
  document.getElementById("nav-zgoraj").innerHTML = navHtml();
  document.getElementById("nav-spodaj").innerHTML = navHtml();
  const kh = kandidatiSectionHtml(L.n);
  if (kh) document.getElementById("status").insertAdjacentHTML("afterend", kh);
  vstaviLogoInSplet(L.n, "#naslov");
}
</script>
<script src="igra.js"></script>
