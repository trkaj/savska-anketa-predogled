<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primerjava odgovorov – tisk A4</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3d24">
<link rel="icon" href="favicon.png">
<style>
@page { size: A4 landscape; margin: 6mm; }
* { box-sizing: border-box; }
html { background: #eceee9; }
body {
  margin: 0 auto;
  color: #111;
  background: #fff;
  font: 11pt/1.2 "Liberation Sans", "DejaVu Sans", "Segoe UI", sans-serif;
}
@media screen {
  body { max-width: 297mm; padding: 8mm 7mm 7mm; margin: 12px auto 40px; box-shadow: 0 0 0 1px #ccc, 0 8px 28px rgba(0,0,0,.12); }
}
.no-print { font: 15px/1.4 "Liberation Sans", "Segoe UI", sans-serif; padding: 0 0 10px; }
.no-print a, .no-print button {
  color: #0b3d24; font-weight: 700; background: #f5c400; border: 0; border-radius: 8px;
  padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-block; margin-right: 8px; font-size: 15px;
}
h1 {
  margin: 0 0 2pt;
  font-size: 13pt;
  line-height: 1.18;
  color: #0b3d24;
}
.podnaslov { margin: 0 0 3pt; color: #0b3d24; font-size: 11pt; }
.legenda { margin: 0 0 4pt; font-size: 11pt; }
.legenda .rok { width: 10pt; height: 10pt; vertical-align: -1.5pt; }
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
th, td {
  border: 0.45pt solid #222;
  padding: 1.4pt 1pt;
  vertical-align: middle;
  text-align: center;
  font-size: 11pt;
}
thead th {
  background: #0b3d24;
  color: #fff;
  font-weight: 700;
  line-height: 1.15;
  padding: 3pt 1pt 3.5pt;
  hyphens: none;
  overflow-wrap: normal;
  word-break: normal;
  letter-spacing: -0.04em;
}
thead th b { display: block; font-size: 12pt; letter-spacing: 0; }
th.vpr { width: 19%; text-align: left; background: #0b3d24; color: #fff; }
tbody th.vpr {
  background: #f4f7f5;
  color: #0b3d24;
  text-align: left;
  font-weight: 650;
  padding-left: 3.5pt;
  overflow-wrap: break-word;
}
tr.skupina th {
  background: #f5c400;
  color: #111;
  text-align: left;
  font-weight: 800;
  padding: 1.2pt 3.5pt;
}
td { position: relative; white-space: nowrap; letter-spacing: -0.03em; padding: 1.6pt 1pt 1.6pt 2pt; }
td.ima-prio { padding-left: 9.5pt; }
td .odg { display: inline-block; }
td .prazna { color: #333; font-weight: 700; letter-spacing: 0; }
.znak {
  display: inline-block;
  width: 0.72em;
  height: 0.72em;
  border-radius: 50%;
  border: 1.15pt solid #111;
  vertical-align: -0.08em;
  background: #fff;
}
.znak.da { background: #111; }
.znak.delno {
  background: linear-gradient(90deg, #111 50%, #fff 50%);
}
.rok {
  display: inline-block;
  color: #111;
  font-family: "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
  font-weight: 700;
  line-height: 1;
}
.legenda .rok { font-size: 12pt; vertical-align: -1pt; }
td .rok {
  position: absolute;
  left: 0.6pt;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10pt;
}
footer.list {
  margin-top: 4pt;
  font-size: 11pt;
  line-height: 1.25;
  color: #111;
  border-top: 2pt solid #0b3d24;
  padding-top: 3pt;
}
@media print {
  html { background: #fff; }
  .no-print { display: none !important; }
  body { max-width: none; padding: 0; margin: 0; box-shadow: none; }
  thead th, th.vpr, tr.skupina th, thead th.vpr, .znak, .znak.da, .znak.delno {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  thead { display: table-header-group; }
  tr.skupina { break-after: avoid; break-inside: avoid; }
  tr { break-inside: avoid; }
}
</style>
</head>
<body>
<p class="no-print"><a href="index.html">← predogled</a><button type="button" onclick="window.print()">Natisni A4</button></p>
<header>
  <h1>Kako so kandidatne liste za svet ČS Bežigrad odgovorile na vprašanja prebivalcev Savskega naselja</h1>
  <p class="podnaslov">Volilna enota 01 · primerjava zavez, kot so jih liste označile (to ni naša ocena)</p>
</header>
<p class="legenda"><span class="znak da" aria-hidden="true"></span> Da &nbsp;·&nbsp; <span class="znak delno" aria-hidden="true"></span> Delno &nbsp;·&nbsp; Ne &nbsp;·&nbsp; – odgovora še ni &nbsp;·&nbsp; <span class="rok" aria-hidden="true">☞</span> ena od 5 prioritet liste</p>
<div id="tabela"></div>
<footer class="list" id="noga"></footer>
<script src="odgovori.js"></script>
<script>
var ROK_SVG = '<span class="rok" aria-hidden="true">☞</span>';
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function znakHtml(odg) {
  if (odg === "Da") return '<span class="znak da" aria-hidden="true"></span> Da';
  if (odg === "Delno") return '<span class="znak delno" aria-hidden="true"></span> Delno';
  return esc(odg);
}
function celica(n, q) {
  var data = typeof ODGOVORI !== "undefined" ? ODGOVORI[n] : null;
  var prio = !!(data && data.prioritetId && data.prioritetId.indexOf(q.temaId) !== -1);
  var mark = prio ? ROK_SVG : "";
  var notranjost;
  if (!data || !data.odgovori[q.id]) {
    notranjost = mark + '<span class="odg prazna">–</span>';
  } else {
    notranjost = mark + '<span class="odg">' + znakHtml(data.odgovori[q.id]) + "</span>";
  }
  return { html: notranjost, prio: prio };
}
(function () {
  if (typeof VPRASANJA === "undefined") return;
  var html = '<table><thead><tr><th class="vpr" scope="col">Vprašanje</th>';
  for (var n = 1; n <= 15; n++) {
    var ime = (typeof LISTE_KRATKO !== "undefined" && LISTE_KRATKO[n]) ? LISTE_KRATKO[n] : String(n);
    html += '<th scope="col"><b>' + n + "</b>" + esc(ime) + "</th>";
  }
  html += "</tr></thead><tbody>";
  var last = "";
  VPRASANJA.forEach(function (q) {
    if (q.tema !== last) {
      last = q.tema;
      html += '<tr class="skupina"><th colspan="16">' + esc(q.tema) + "</th></tr>";
    }
    html += '<tr><th class="vpr" scope="row">' + esc(q.label) + "</th>";
    for (var n = 1; n <= 15; n++) {
      var c = celica(n, q);
      html += '<td' + (c.prio ? ' class="ima-prio"' : '') + ">" + c.html + "</td>";
    }
    html += "</tr>";
  });
  html += "</tbody></table>";
  document.getElementById("tabela").innerHTML = html;

  var fmt = new Intl.DateTimeFormat("sl-SI", {
    timeZone: "Europe/Ljubljana",
    day: "numeric",
    month: "numeric",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
  document.getElementById("noga").innerHTML =
    "Presek: " + fmt.format(new Date()) + " (Europe/Ljubljana). "
    + "Vir: odgovori list na anketa.savska.org. "
    + "Civilna iniciativa prebivalcev Savskega naselja · savskonaselje1@gmail.com · 070 205 595. "
    + "Liste lahko odgovorijo do torka, 10. 11. 2026, do 24.00.";
})();
</script>
</body>
</html>
