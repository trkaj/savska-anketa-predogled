/* Slog usklajen s savska.org (css/slog.css): velike pisave, visok kontrast */
:root{
  --besedilo:#111; --ozadje:#fff; --svetlo:#f3f6f1; --glavna:#0a5232; --glavna-temna:#063a23;
  --poudarek:#ffd84d; --rob:#5b5b5b; --opozorilo:#7a1f00; --zgled:#fff3c4;
  --modra:#dce7ff; --modra-temna:#0b2a6b;

}
html{font-size:var(--velikost)}
html[data-velikost="2"]{--velikost:23px}
html[data-velikost="3"]{--velikost:26px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;color:var(--besedilo);background:var(--svetlo);overflow-wrap:break-word}
.okvir{max-width:40rem;margin:0 auto;padding:0 1rem}
:focus-visible{outline:4px solid #000;outline-offset:3px;box-shadow:0 0 0 7px var(--poudarek)}
h1{font-size:1.6rem;line-height:1.2;margin:.4rem 0 .6rem;color:var(--glavna-temna)}
h2{font-size:1.4rem;line-height:1.25;margin:.2rem 0 .5rem;color:var(--glavna-temna)}
h2:focus{outline:none}
h3{font-size:1.1rem;line-height:1.3;margin:0 0 .5rem}
p{margin:.4rem 0 .8rem}
.glava{background:var(--glavna);color:#fff}
.glava .okvir{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding-top:.5rem;padding-bottom:.5rem}
.logo{font-weight:800;font-size:24px;color:#fff;line-height:1.2}
.logo span{color:var(--poudarek)}
.logo small{display:block;font-weight:600;font-size:14px;opacity:.9}
.velikost{display:flex;gap:.25rem}
.velikost button{min-width:46px;min-height:46px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;border-radius:8px;cursor:pointer;font-size:16px;padding:0 6px}
.velikost button[aria-pressed="true"]{background:#fff;color:var(--glavna-temna)}
.napredek{background:#fff;border-bottom:2px solid #dfe6dc}
.napredek .okvir{padding-top:.5rem;padding-bottom:.6rem}
.napredek-napis{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--glavna-temna);margin-bottom:.3rem;gap:.5rem}
.vrstica{height:.7rem;background:#dfe6dc;border-radius:1rem;overflow:hidden}
.vrstica div{height:100%;background:var(--glavna);border-radius:1rem;transition:width .3s}
main{padding:1rem 0 7rem}
.kartica{background:#fff;border:2px solid #c9d3c6;border-radius:.8rem;padding:1rem;margin:0 0 1rem}
.vprasanje{margin:0 0 1.3rem}
.vprasanje > .nasl{display:block;font-weight:700;font-size:1.08rem;line-height:1.35;margin:0 0 .5rem}
.namig{font-size:.85rem;color:#333;margin:.2rem 0 .6rem}
.papir-gumbi{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin:.4rem 0 0}
.papir-gumbi a.gumb{text-decoration:none;min-height:2.75rem;display:inline-flex;align-items:center}
.papir-gumbi a.povezava{min-height:2.75rem;display:inline-flex;align-items:center}
.sklop{display:inline-block;font-size:.75rem;font-weight:700;padding:.15rem .6rem;border-radius:1rem;background:#e2ece0;color:var(--glavna-temna);margin-bottom:.3rem}
.izbire{display:flex;flex-direction:column;gap:.5rem}
.izbire.mreza{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
@media (max-width:420px){html[data-velikost="3"] .izbire.mreza{grid-template-columns:1fr}}
.izbira span{min-width:0}
.izbira{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;min-height:3.1rem;border:2px solid #b5bfb2;border-radius:.6rem;cursor:pointer;background:#fff;font-size:1rem;line-height:1.25}
.izbira input{width:1.5rem;height:1.5rem;flex:none;margin:0;accent-color:var(--glavna)}
.izbira:has(input:checked){border-color:var(--glavna);background:#e4f0e0;font-weight:700}
.izbira:has(input:disabled){opacity:.45;cursor:not-allowed}
.mreza .izbira{padding:.55rem .6rem;font-size:.92rem}
.tema{border:2px solid #c9d3c6;border-radius:.7rem;padding:.8rem;margin:0 0 .8rem;background:#fff}
.tema h3{margin:0}
.tema .opis{font-size:.85rem;color:#333;margin:.1rem 0 .55rem}
textarea,input[type=text],select{font:inherit;font-size:1rem;padding:.7rem .8rem;border:2px solid var(--rob);border-radius:.5rem;width:100%;background:#fff;color:#111}
textarea{resize:vertical;min-height:7.5rem}
.zgled-trak{background:var(--zgled);border:3px dashed #8a6d00;padding:.5rem .7rem;border-radius:.5rem;font-size:.85rem;font-weight:600;margin:0 0 .8rem}
.manjka{background:var(--zgled);border:2px dashed #8a6d00;padding:0 .3rem;border-radius:.3rem;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.obvestilo{list-style:none;padding:0;margin:.3rem 0 0}
.obvestilo li{border-left:6px solid var(--glavna);background:var(--svetlo);padding:.5rem .7rem;margin:0 0 .5rem;border-radius:.3rem;font-size:.92rem}
.obvestilo strong{color:var(--glavna-temna)}
.gumb{font:inherit;font-weight:700;font-size:1.05rem;min-height:3.3rem;padding:.6rem 1.2rem;border-radius:.6rem;border:2px solid var(--glavna);background:#fff;color:var(--glavna-temna);cursor:pointer}
.gumb.glavni{background:var(--glavna);color:#fff}
.gumb.siroko{width:100%}
.gumb.moder{background:var(--modra-temna);border-color:var(--modra-temna);color:#fff}
.gumb[disabled]{opacity:.4;cursor:default}
.navigacija{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #c9d3c6;box-shadow:0 -4px 12px rgba(0,0,0,.06);z-index:5}
.navigacija .okvir{display:flex;gap:.6rem;padding-top:.6rem;padding-bottom:.7rem}
.navigacija .gumb{flex:1}
.navigacija .gumb.glavni{flex:1.6}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* zemljevid */
.zem{position:relative;background:#f7f7f4;border:2px solid var(--rob);border-radius:.6rem;overflow:hidden;margin:0 0 .3rem}
.zem svg{display:block;width:min(100%, calc(78vh * 1173 / 1683));aspect-ratio:1173/1683;height:auto;margin:0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zem .pp{fill:rgba(255,255,255,0);stroke:none;cursor:pointer;pointer-events:all}
@media (hover:hover){.zem .pp:hover{fill:rgba(255,216,77,.35);stroke:#8a6d00;stroke-width:4}}
.zem .pp:focus{outline:none}
.zem .pp:focus-visible{stroke:#000;stroke-width:7;fill:rgba(255,216,77,.35)}
.zem .pp.on{fill:rgba(10,82,50,.42);stroke:var(--glavna-temna);stroke-width:8;stroke-linejoin:round}
.zem .pp.on:focus-visible{stroke:#000}
.zem .oz{pointer-events:none}
.zem .oz circle{fill:var(--glavna);stroke:var(--poudarek);stroke-width:7}
.zem .oz text{fill:#fff;font:800 30px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.povezava-gumb{font:inherit;font-weight:700;background:none;border:none;color:var(--glavna-temna);text-decoration:underline;cursor:pointer;padding:.5rem 0;margin:.2rem 0 .6rem}
.vrsta .nasl{display:block;font-weight:700;margin:.2rem 0 .35rem}
.vrsta select{width:100%}
.natancneje{margin-top:.5rem}.natancneje summary{cursor:pointer;color:var(--glavna-temna);font-size:.9rem;font-weight:600}.natancneje input{margin-top:.4rem;width:100%}
.zem-opomba{font-size:.75rem;color:#444;margin:.1rem 0 .7rem}
.izbrana-polja{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .6rem;font-size:.9rem}
.izbrana-polja .cip{display:inline-flex;align-items:center;gap:.35rem;background:#e4f0e0;border:2px solid var(--glavna);border-radius:2rem;padding:.2rem .7rem .2rem .3rem;font-weight:700}
.st{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:2rem;height:2rem;border-radius:50%;border:2px solid #1f3b73;color:#1f3b73;background:#fff;font-weight:800;font-size:.85rem;line-height:1}
.izbira .st,.cip .st{min-width:2rem;width:2rem}
.st.raz{border-color:#7a5c00;color:#7a5c00;background:#fff4d6}
.izbira:has(input:checked) .st,.cip .st{background:var(--glavna);border-color:var(--glavna);color:#fff}
.seznam-polj{border:none;margin:0 0 .6rem;padding:0}
.seznam-polj legend{font-weight:700;font-size:1.02rem;padding:0;margin:0 0 .4rem}
.seznam-polj .podnasl{font-size:.8rem;font-weight:700;color:var(--glavna-temna);margin:.7rem 0 .35rem}
.seznam-polj .podnasl.raz{color:#7a5c00}
.seznam-polj .izbira{font-size:.92rem;padding:.45rem .7rem;min-height:2.9rem}
.izbira.celo{border-style:dashed;border-color:var(--glavna);margin:.2rem 0 .8rem}
details.papir{border:2px dashed var(--rob);border-radius:.6rem;background:#fff;padding:.3rem .8rem;margin:.6rem 0 1rem}
details.papir summary{font-weight:700;cursor:pointer;color:var(--glavna-temna);min-height:2.6rem;padding:.4rem 0}
.papir img{display:block;width:100%;height:auto;border:1px solid #999}
.papir .navodilo{font-size:1.05rem;font-weight:700;margin:.4rem 0 .5rem}
.papir .navodilo-celo{font-size:.95rem;margin:.5rem 0 .2rem}
.samo-tisk{display:none}
.zem-klik{position:relative}.zem-klik svg{position:absolute;inset:0;width:100%;height:100%}.zem-klik path{fill:transparent;stroke:none;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0)}.zem-klik path.on{fill:rgba(20,110,60,.22);stroke:#0b5d2e;stroke-width:6}.zem-klik path.akt{fill:rgba(244,196,48,.45);stroke:#b07800;stroke-width:12}.zem-klik .ozn{cursor:pointer}.zem-klik .ozn circle{fill:#0b5d2e;stroke:#fff;stroke-width:6}.zem-klik .ozn.akt circle{fill:#b07800}.zem-klik .ozn text{fill:#fff;font:700 52px sans-serif;text-anchor:middle;dominant-baseline:central}
.vrsta .stv{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:#0b5d2e;color:#fff;font-size:.85em;margin-right:.4em}.vrsta.akt{border-color:#b07800;box-shadow:0 0 0 3px rgba(244,196,48,.6)}.vrsta.akt .stv{background:#b07800}.oznaci-zem{font:inherit;font-size:1rem;margin:.5rem 0 .2rem;padding:.45rem .8rem;border:2px solid #0b5d2e;background:#fff;color:#0b5d2e;border-radius:.4rem;font-weight:700;cursor:pointer;min-height:44px}.vrsta.akt .oznaci-zem{background:#f4c430;border-color:#b07800;color:#3a2a00}.zem-zdaj{position:sticky;top:0;z-index:2;background:#fff7d6;border:2px solid #b07800;border-radius:.4rem;padding:.45rem .6rem;margin:.4rem 0;font-weight:700}.zem-zetoni{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}.zeton{font:inherit;font-size:.95rem;min-height:40px;padding:.3rem .65rem;border-radius:2rem;border:2px solid #0b5d2e;background:#fff;color:#0b5d2e;font-weight:700;cursor:pointer}.zeton.akt{background:#f4c430;border-color:#b07800;color:#3a2a00}@media (max-width:480px){.zem-zdaj{font-size:.9rem;padding:.35rem .45rem}.zeton{font-size:.85rem;min-height:36px;padding:.2rem .5rem}.zem-zetoni{gap:.25rem}}.zem-potrd{display:block;font-weight:400;font-size:.9rem;margin-top:.3rem;color:#0b5d2e}.vrsta h3{cursor:pointer}.pobrisi-kraj{font:inherit;font-size:.9rem;margin-left:.5rem;background:none;border:none;color:#a33;text-decoration:underline;cursor:pointer;min-height:44px}
@media print{.oznaci-zem,.zem-zdaj,.zem-klik .ozn{display:none}}
@media print{.zem-klik svg{display:none}}
.samo-zaslon{font-size:.95rem;margin:.4rem 0 .6rem;background:#eef5ef;padding:.6rem .8rem;border-radius:.5rem}
#zasebnost-okno{max-width:40rem;width:calc(100% - 1.5rem);max-height:90vh;border:none;border-radius:.7rem;padding:1.1rem 1.2rem;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#zasebnost-okno::backdrop{background:rgba(0,0,0,.45)}
#zasebnost-okno h2{margin-top:0}#zasebnost-okno h3{font-size:1rem;margin:.9rem 0 .2rem}#zasebnost-okno p,#zasebnost-okno li{font-size:.95rem}
.opomba-imena{font-size:.8rem;color:#555;margin:.25rem 0 0}
@media print{#zasebnost-okno{display:none!important}}
@media print{.samo-tisk{display:block!important}.samo-zaslon{display:none!important}}
@media print{
  .glava,.napredek,.navigacija{display:none!important}
  body,main{background:#fff;padding:0}
  body[data-korak="zemljevid"] main .okvir > *:not(.papir){display:none!important}
  body[data-korak="zemljevid"] details.papir{border:none;padding:0;margin:0}
  body[data-korak="zemljevid"] details.papir > summary,.papir .gumb{display:none!important}
  .papir img{border:none}
  body[data-korak="zemljevid"] .okvir{max-width:none}
}
.kraj{border-left:6px solid var(--glavna);background:#fff;border-radius:.4rem;padding:.7rem .8rem;margin:.6rem 0;border:2px solid #c9d3c6;border-left-width:6px}
.kraj h3{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.kraj .odstrani{font:inherit;font-size:.8rem;font-weight:700;background:none;border:none;color:var(--opozorilo);text-decoration:underline;cursor:pointer;padding:.3rem}
.sporocilo{font-weight:700;color:var(--opozorilo);font-size:.9rem;min-height:1.3em;margin:.2rem 0}
/* diploma in deljenje */
.diploma{margin:1rem 0;text-align:center}
.diploma canvas{width:100%;height:auto;border:1px solid #ddd;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);background:#fffdf5}
.diploma label{display:block;text-align:left;margin:.6rem 0 .3rem;font-weight:600}
.diploma input{width:100%;box-sizing:border-box;padding:.6rem;font-size:1rem;border:1px solid #bbb;border-radius:6px}
.spol-izbira{display:flex;gap:.5rem;margin:.3rem 0 .2rem}.spol-izbira button{flex:1;padding:.6rem;font-size:1rem;border:2px solid #2e7d32;border-radius:6px;background:#fff;color:#1b5e20;cursor:pointer}.spol-izbira button[aria-pressed="true"]{background:#2e7d32;color:#fff;font-weight:700}
.diploma .ios-slika img{width:100%;margin-top:.6rem;border:1px solid #ddd}
.deli-gumbi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.6rem 0}
.deli-gumbi a,.deli-gumbi button{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.topla-zahvala{text-align:center;font-size:1.15rem;margin:1rem 0 .4rem}
@media print{.diploma,.deli-razdelek,.topla-zahvala{display:none!important}}
/* zahvala */
.zahvala-glava{text-align:center;padding:.4rem 0 .2rem}
.kljukica{display:inline-flex;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--glavna);color:#fff;font-size:2rem;align-items:center;justify-content:center;font-weight:800}
details.povzetek summary{font-weight:700;cursor:pointer;color:var(--glavna-temna);font-size:1.05rem;padding:.3rem 0;min-height:2.4rem}
.povzetek dl{margin:.5rem 0 0}
.povzetek dt{font-weight:700;font-size:.85rem;color:#333;margin-top:.55rem}
.povzetek dd{margin:0;font-size:.95rem;border-bottom:1px solid #e3e8e1;padding-bottom:.35rem}
.prazno{color:#777;font-style:italic}
.modri{background:var(--modra);border:3px solid var(--modra-temna);border-radius:.8rem;padding:1rem;margin:1rem 0}
.modri h2{color:var(--modra-temna)}
.modri .izbira:has(input:checked){border-color:var(--modra-temna);background:#c6d6fb}
.modri .izbira input{accent-color:var(--modra-temna)}
.locen{background:#fff;border:2px dashed var(--modra-temna);border-radius:.5rem;padding:.5rem .7rem;font-size:.88rem;margin:.3rem 0 .9rem}
.modri label.polje-nasl{display:block;font-weight:700;margin:.7rem 0 .3rem}
.soglasje{align-items:flex-start;font-size:.85rem;font-weight:400!important}
.soglasje input{margin-top:.1rem}
.ok{background:#e4f0e0;border:2px solid var(--glavna);border-radius:.5rem;padding:.5rem .7rem;font-weight:700;margin:.6rem 0 0}
.stevec{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--glavna-temna);color:#fff;border-radius:.6rem;padding:.55rem .8rem;margin:0 0 .8rem;font-weight:700}
.stevec .pike{display:flex;gap:.3rem}

.locen-znak{display:inline-block;font-size:.75rem;font-weight:700;padding:.15rem .6rem;border-radius:1rem;background:var(--modra);color:var(--modra-temna);margin-bottom:.3rem}
.prenos{background:#fff;border-radius:.5rem;padding:.5rem .7rem;font-size:.9rem;margin:.2rem 0 .6rem}
.povezava{font:inherit;font-weight:700;background:none;border:none;color:var(--glavna-temna);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:.6rem;width:100%;min-height:3rem}
.logo-uvod{display:block;margin:.4rem auto .8rem;height:140px;width:auto;max-width:100%}

.logo-tisk{height:70px;width:auto;margin:0 auto .4rem}
@media print{.logo-tisk{display:block!important}}
.naziv{margin-top:.35rem;font-size:.85rem;font-weight:700;color:var(--glavna-temna)}
.naziv b{background:var(--poudarek,#f4c430);color:#1b3a1b;border-radius:1rem;padding:.05rem .55rem}
.naziv-obvestilo{position:fixed;left:50%;top:.8rem;transform:translate(-50%,-150%);z-index:50;background:#1b4d2e;color:#fff;font-weight:700;padding:.6rem 1rem;border-radius:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .35s;max-width:92vw;text-align:center}

.naziv-koncni{position:relative;text-align:center;margin:.4rem 0 1rem;padding:1rem;border-radius:1rem;background:#fff8dc;border:2px solid var(--poudarek,#f4c430);overflow:hidden}

.naziv-koncni.velik .napis{font-size:1.6rem;color:var(--glavna-temna)}

/* ---------- pomočniki ---------- */
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function get(pot){ var o=S, d=pot.split('.'); for(var i=0;i<d.length;i++){ if(o==null) return undefined; o=o[d[i]]; } return o; }
function set(pot,v){ var o=S, d=pot.split('.'); for(var i=0;i<d.length-1;i++){ if(o[d[i]]==null||typeof o[d[i]]!=='object') o[d[i]]={}; o=o[d[i]]; } o[d[d.length-1]]=v; }
var uid=0;
function vpr(naslov, vsebina, namig){
  return '<div class="vprasanje"><span class="nasl">'+naslov+'</span>'+(namig?'<p class="namig">'+namig+'</p>':'')+vsebina+'</div>';
}
function radio(k, opts, o){ o=o||{}; var v=get(k), n='r'+(uid++);
  return '<div class="'+(o.cipi?'cipi':'izbire'+(o.mreza?' mreza':''))+'" role="radiogroup">'+opts.map(function(x){
    return '<label class="izbira"><input type="radio" name="'+n+'" data-k="'+k+'" value="'+esc(x)+'"'+(v===x?' checked':'')+(o.rerender?' data-rerender="1"':'')+'><span>'+esc(x)+'</span></label>';
  }).join('')+'</div>'; }
function check(k, opts, max, o){ o=o||{}; var v=get(k)||[];
  return '<div class="'+(o.cipi?'cipi':'izbire')+'">'+opts.map(function(x){
    var val=(typeof x==='object')?x.id:x, ime=(typeof x==='object')?x.ime:x, on=v.indexOf(val)>-1;
    return '<label class="izbira"><input type="checkbox" data-k="'+k+'" value="'+esc(val)+'"'+(max?' data-max="'+max+'"':'')+(on?' checked':'')+(max&&!on&&v.length>=max?' disabled':'')+'><span>'+esc(ime)+'</span></label>';
  }).join('')+'</div><p class="sporocilo" data-sporocilo="'+k+'"></p>'; }
function besedilo(k, ph, vrstice, id){ var v=get(k)||'';
  return vrstice ? '<textarea data-k="'+k+'" rows="'+vrstice+'" placeholder="'+esc(ph)+'"'+(id?' id="'+id+'"':'')+'>'+esc(v)+'</textarea><p class="opomba-imena">Prosimo, ne navajajte imen drugih oseb.</p>'
                 : '<input type="text" data-k="'+k+'" placeholder="'+esc(ph)+'" value="'+esc(v)+'"'+(id?' id="'+id+'"':'')+'>'+'<p class="opomba-imena">Prosimo, ne navajajte imen drugih oseb.</p>'; }
function izbirnik(k, opts, prazno){ var v=get(k)||'';
  return '<select data-k="'+k+'"><option value="">'+esc(prazno)+'</option>'+opts.map(function(x){return '<option'+(v===x?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>'; }
function glava(sklop, naslov, uvod){ return '<span class="sklop">'+sklop+'</span><h2 tabindex="-1">'+naslov+'</h2>'+(uvod?'<p>'+uvod+'</p>':''); }
function imeTeme(id){ if(id==='drugo') return S.drugoTema?('Drugo: '+S.drugoTema):'Drugo'; for(var i=0;i<TEME.length;i++) if(TEME[i].id===id) return TEME[i].ime; return id; }
function izbrane(){ return TEME.filter(function(t){ return S.izbor.indexOf(t.id)>-1; }); }
function uskladiVrste(){
  var tz=izbrane();
  if(!tz.length){ S.vrste=[{}]; return; }
  var old=S.vrste||[], used={};
  S.vrste=tz.map(function(t){
    var ime=imeTeme(t.id), prev=null;
    for(var i=0;i<old.length;i++){
      if(used[i]) continue;
      if(old[i].temaId===t.id || old[i].tema===ime){ prev=old[i]; used[i]=true; break; }
    }
    return {temaId:t.id, tema:ime, polje:(prev&&prev.polje)||'', opis:(prev&&prev.opis)||''};
  });
}
function skupina(){ var s=S.starost;

  if(s==='15–24') return 'mladi';
  if(s==='25–34'||s==='35–49'||s==='50–64') return 'odrasli';
  if(s==='65–74'||s==='75 ali več') return 'starejsi';
  return null; }
function gPrevoz(){ return S.prevozDnevni==='Drugo'?('Drugo: '+(S.prevozDrugo||'')).trim():(S.prevozDnevni||''); }
function gCena(){ return (S.garazaCena||'').trim(); }
function gNajem(){ return (S.garazaNajem||'').trim(); }
function brezDvigala(){ return S.dvigalo!=='da'; }
function predstavnik(){ return S.upr.predstavnik==='Da'||S.upr.predstavnik==='Morda'; }
function zeliListek(){ return biSodeloval()||predstavnik(); }
function biSodeloval(){ return S.sod.zelja==='da'||S.sod.zelja==='mogoče'; }

 {id:'zemljevid', sklop:'Za vse', render:function(){
   uskladiVrste();

   if(!tz.length){
     return glava('Za vse','Kje so te težave?','Najprej izberite težave v prejšnjem koraku. Ta korak lahko tudi preskočite.')+
     '<div class="kartica"><p>Niste izbrali nobene težave, zato krajev tu ne označujemo. Če želite, se vrnite nazaj in izberite do 5 težav, sicer nadaljujte.</p></div>';
   }
   var kraji=['ne vem / celo naselje'].concat(POLJA.map(function(p){ return p.st+' – '+p.ime; }));
   var akt=zemAktivna();
   var vrste=S.vrste.map(function(v,i){
     return '<div class="kraj vrsta'+(i===akt?' akt':'')+'" data-vrsta="'+i+'"><h3><span><span class="stv" aria-hidden="true">'+(i+1)+'</span>'+esc(v.tema||('Težava '+(i+1)))+'</span></h3>'+
       '<span class="nasl">Kje?</span>'+izbirnik('vrste.'+i+'.polje', kraji, '– izberite kraj –')+
       '<details class="natancneje"'+(v.opis?' open':'')+'><summary>natančneje (neobvezno)</summary>'+besedilo('vrste.'+i+'.opis','npr. klop pred Linhartovo 84')+'</details>'+
       '<button type="button" class="oznaci-zem" data-oznaci="'+i+'" aria-pressed="'+(i===akt?'true':'false')+'">'+(i===akt?'✔ Označujete na zemljevidu':'Označi na zemljevidu')+'</button>'+(v.polje?'<button type="button" class="pobrisi-kraj" data-pobrisi="'+i+'">pobriši kraj</button>':'')+
     '</div>';
   }).join('');
   return glava('Za vse','Kje so te težave?','Za težave, ki ste jih izbrali, označite kraj. Tema je že izbrana – tu samo kje. Lahko tudi preskočite.')+
   vrste+
   '<details class="papir"'+(S.zemOdprt!==false?' open':'')+' id="zem-papir"><summary>Pokaži zemljevid s številkami krajev (tudi za tisk)</summary>'+
   '<p class="samo-zaslon">Pri težavi pritisnite »Označi na zemljevidu«, nato se dotaknite polja – kraj se zapiše samo tej težavi. Številke v krogcih kažejo, katera težava je kje. Pri »Kje?« je tudi možnost »ne vem / celo naselje«.</p>'+
   (akt>-1?'<div class="zem-zdaj samo-zaslon" id="zem-zdaj"><span aria-live="polite">Zdaj označujete: '+(akt+1)+' – '+esc(S.vrste[akt].tema||('Težava '+(akt+1)))+'</span>'+
     '<div class="zem-zetoni" role="group" aria-label="Izberite težavo za označevanje">'+S.vrste.map(function(v,i){ return '<button type="button" class="zeton'+(i===akt?' akt':'')+'" data-oznaci="'+i+'" data-ostani="1" aria-pressed="'+(i===akt?'true':'false')+'">'+(i+1)+' '+esc(kratkoTema(v.tema||('Težava '+(i+1))))+(v.polje?' ✓':'')+'</button>'; }).join('')+'</div>'+
     (zemPotrd?'<span class="zem-potrd" role="status">'+esc(zemPotrd)+'</span>':'')+'</div>':'')+'<p class="navodilo samo-tisk">Kje v naselju je to? Ob vsako težavo zgoraj zapišite številko polja z zemljevida (lahko različno za vsako).</p>'+
'<div class="zem-klik"><img src="'+ZEM_SLIKA+'" alt="Zemljevid Savskega naselja z oštevilčenimi polji od 1 do 18 in seznamom imen polj"><svg viewBox="0 0 2480 1748" aria-hidden="true">'+POLJA.map(function(p){ var on=S.vrste.some(function(v){return v.polje&&v.polje.indexOf(p.st+' – ')===0;}); var ak=akt>-1&&S.vrste[akt].polje&&S.vrste[akt].polje.indexOf(p.st+' – ')===0; return '<path data-zem-polje="'+p.st+'" class="'+(on?'on':'')+(ak?' akt':'')+'" d="'+p.d+'"/>'; }).join('')+zemOznake(akt)+'</svg></div>'+
   '<p class="zem-opomba">Osnutek, meje so orientacijske.</p>'+
   '<p class="navodilo-celo samo-tisk">☐ Ne vem / velja za celo naselje</p>'+
   '<a class="gumb" href="savska-anketa-papir.docx" download>Prenesi papirno anketo (Word)</a><button type="button" class="gumb" id="natisni-papir">Natisni ta povzetek</button>'+
   '</details>';
 }},
