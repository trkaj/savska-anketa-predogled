<!doctype html><html lang="sl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Letaki ankete – kateri vhodi so pokriti</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
header{background:#0a5232;color:#fff;padding:10px 14px}header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;font-size:14px}header a{color:#ffd84d;font-weight:700}
#stanje{font-size:14px;padding:8px 14px;background:#f3f6f1;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.k{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:1px solid #333}
#iskanje{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid #ddd}
#iskanje input{font-size:16px;padding:8px;border:1px solid #999;border-radius:6px;flex:1;min-width:140px}
#obv{font-weight:700;color:#063a23;padding:0 14px}
#map{height:60vh;min-height:360px}
button{font-size:14px;padding:6px 10px;border-radius:6px;border:0;cursor:pointer;font-weight:700}
.vz{background:#0a5232;color:#fff}.rz{background:#2e9e5b;color:#fff}.sp{background:#eee;color:#333}
#seznam{padding:6px 14px 30px}.ul{margin:14px 0 4px;font-size:16px;color:#063a23}
.vh{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:4px 6px 4px 10px;border-radius:8px;border:1px solid #bbb;background:#fff;font-size:15px}
.vh.prevzeto{background:#fff4c2;border-color:#d9b400}.vh.razdeljeno{background:#dff3e6;border-color:#2e9e5b}
.vh b{min-width:26px}.vh button{padding:4px 8px;font-size:13px}
.vsi{font-size:13px;margin-left:8px;background:#e6efe9;color:#063a23;padding:3px 8px}
.napaka{color:#7a1f00;font-weight:600}
</style></head><body>
<header><h1>Letaki ankete – kateri vhodi so pokriti</h1>
<p>Vpiši vzdevek, poišči svoj vhod in klikni <b>Vzamem</b>. Zapis gre v <a id="tabela" href="#">tabelo</a>.</p></header>
<div id="stanje"><span><span class="k" style="background:#c9c9c9"></span>prosto</span><span><span class="k" style="background:#ffd84d"></span>prevzeto</span><span><span class="k" style="background:#2e9e5b"></span>razdeljeno</span><span id="povzetek"></span></div>
<div id="iskanje"><input id="vzdevek" placeholder="Tvoj vzdevek ali začetnice" maxlength="30" autocomplete="nickname"><input id="isci" placeholder="Išči ulico ali hišno številko …" type="search"></div>
<div id="obv"></div>
<div id="map"></div>
<div id="seznam"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SHEET='1ELfFyY5O-UxguptOQYwFl9dj7dTx4qpTBERhO48UUww';
const SKRIPT='https://script.google.com/macros/s/AKfycbx4kPkxsr8lGadd8bYONl9YwV5B6elslSeiyznei8JmUrfrs-CuwrUWY5Qo93pRFPEG1A/exec';
document.getElementById('tabela').href='https://docs.google.com/spreadsheets/d/'+SHEET+'/edit';
const CSV='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=1';
const norm=s=>(s||'').trim().replace(/\s+/g,' ').replace(/-/g,'–');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r}
const jeDa=s=>/^(da|ja|✅|✔|x|razdeljeno|opravljeno)/i.test((s||'').trim());
const BARVA={prosto:'#c9c9c9',prevzeto:'#ffd84d',razdeljeno:'#2e9e5b'};
let VH=[],tocke=[],stanje={};
const map=L.map('map',{zoomSnap:.25});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const vz=document.getElementById('vzdevek');vz.value=localStorage.getItem('vzdevek')||'';vz.oninput=()=>{localStorage.setItem('vzdevek',vz.value.trim());seznam()};
document.getElementById('isci').oninput=()=>seznam();
function obv(t){const o=document.getElementById('obv');o.textContent=t;o.style.padding=t?'8px 14px':'0 14px'}
const st=i=>stanje[VH[i].k]||{s:'prosto',kdo:''};
const moj=i=>{const k=vz.value.trim().toLowerCase();return k&&st(i).kdo.toLowerCase()==k};
function gumbi(i){const s=st(i);
 if(s.s=='prosto')return '<button class="vz" onclick="akcija(['+i+'],\'prevzemi\')">Vzamem</button>';
 if(s.s=='prevzeto'&&moj(i))return '<button class="rz" onclick="akcija(['+i+'],\'razdeljeno\')">Razdeljeno</button><button class="sp" onclick="akcija(['+i+'],\'sprosti\')">✕</button>';
 return ''}
function popup(i){const s=st(i);return '<b>'+esc(VH[i].u+' '+VH[i].n)+'</b><br>'+s.s+(s.s=='razdeljeno'?' ✅':'')+'<br>'+gumbi(i)}
function izris(){
 tocke.forEach((m,i)=>{const s=st(i).s;m.setStyle({fillColor:BARVA[s]});if(m.isPopupOpen())m.setPopupContent(popup(i))});
 const n=VH.length,p=VH.filter((v,i)=>st(i).s!='prosto').length,d=VH.filter((v,i)=>st(i).s=='razdeljeno').length;
 document.getElementById('povzetek').innerHTML='<b>Prevzetih '+p+' od '+n+' vhodov, razdeljenih '+d+'</b>';
 seznam()}
function seznam(){const q=norm(document.getElementById('isci').value).toLowerCase();let h='',ul='';
 const vidni=VH.map((v,i)=>i).filter(i=>!q||(VH[i].u+' '+VH[i].n).toLowerCase().includes(q));
 vidni.forEach(i=>{const v=VH[i];if(v.u!=ul){if(ul)h+='</div>';ul=v.u;
   const pr=vidni.filter(j=>VH[j].u==ul&&st(j).s=='prosto');
   h+='<h3 class="ul">'+esc(ul)+(pr.length>1?'<button class="vsi" onclick="akcija(['+pr.join(',')+'],\'prevzemi\')">Vzamem vse proste ('+pr.length+')</button>':'')+'</h3><div>'}
  const s=st(i).s;h+='<span class="vh '+s+'"><b>'+esc(v.n)+'</b>'+(s=='razdeljeno'?'✅':'')+gumbi(i)+'</span>'});
 document.getElementById('seznam').innerHTML=h+(ul?'</div>':'<p>Ni zadetkov.</p>')}
async function akcija(ids,a){const kdo=vz.value.trim();
 if(!kdo){obv('Najprej zgoraj vpiši vzdevek ali začetnice.');vz.focus();window.scrollTo(0,0);return}
 if(a=='sprosti'&&!confirm('Res sprostim '+VH[ids[0]].u+' '+VH[ids[0]].n+'?'))return;
 if(ids.length>3&&!confirm('Vzameš '+ids.length+' vhodov na ulici '+VH[ids[0]].u+'?'))return;
 obv('Shranjujem …');let ok=0,zad='';
 for(const i of ids){try{const r=await fetch(SKRIPT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({akcija:a,ulica:VH[i].u,st:VH[i].n,kdo})});
  const j=await r.json();zad=j.sporocilo;if(j.ok){ok++;stanje[VH[i].k]={s:a=='prevzemi'?'prevzeto':a=='razdeljeno'?'razdeljeno':'prosto',kdo:a=='sprosti'?'':kdo}}}catch(e){zad='Povezava ni uspela, poskusi znova.'}
  if(ids.length>1)obv('Shranjujem … '+ok+'/'+ids.length)}
 obv(ids.length>1?'Vzeto '+ok+' od '+ids.length+' vhodov.':zad);izris();setTimeout(nalozi,5000)}
async function nalozi(){
 try{const t=await (await fetch(CSV+'&t='+Date.now())).text();if(t.trim().startsWith('<'))throw 0;
  const ns={};parseCSV(t).slice(1).forEach(x=>{if(!x[0])return;const kdo=(x[2]||'').trim();
   ns[norm(x[0])+'|'+norm(x[1])]={s:jeDa(x[3])?'razdeljeno':kdo?'prevzeto':'prosto',kdo}});
  stanje=ns;izris();
 }catch(e){document.getElementById('seznam').innerHTML='<p class="napaka">Tabele trenutno ni mogoče prebrati.</p>'}}
Promise.all([fetch('vhodi.json').then(r=>r.json()),fetch('meja.json').then(r=>r.json())]).then(([v,meja])=>{
 VH=v.map(x=>({u:x[0],n:x[1],k:norm(x[0])+'|'+norm(x[1]),ll:[x[2],x[3]]}));
 const ring=meja.map(c=>[c[1],c[0]]);
 L.polygon([[[-90,-180],[-90,180],[90,180],[90,-180]],ring],{stroke:false,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(map);
 L.polygon(ring,{color:'#063a23',weight:3,fill:false,interactive:false}).addTo(map);
 tocke=VH.map((x,i)=>L.circleMarker(x.ll,{radius:7,color:'#333',weight:1,fillColor:BARVA.prosto,fillOpacity:.95}).bindPopup(()=>popup(i)).bindTooltip(x.n,{direction:'top',offset:[0,-6]}).addTo(map));
 const b=L.latLngBounds(ring);map.fitBounds(b,{padding:[8,8]});map.setMaxBounds(b.pad(0.15));map.options.maxBoundsViscosity=1;map.setMinZoom(map.getZoom());
 izris();nalozi();setInterval(nalozi,60000)});
</script></body></html>
